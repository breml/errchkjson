name: Go Matrix

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:

  cross:
    name: Go
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0

    strategy:
      matrix:
        go-version: [ "stable", "oldstable", "1.x" ]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-${{ matrix.go-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.go-version }}-go-

      - name: Test
        run: go test -v -cover ./...

      - name: Build
        run: go build -ldflags "-s -w" -trimpath -o errchkjson ./cmd/errchkjson/

  # TODO: this job can be removed once Go 1.28 is released and GOEXPERIMENT=jsonv2 becomes a no-op.
  jsonv2-experiment:
    name: Go oldstable with GOEXPERIMENT=jsonv2
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      # Run the encoding/json/v2 tests with Go versions, where encoding/json/v2
      # is only available as experiment (no-op for Go 1.27 and newer).
      GOEXPERIMENT: jsonv2

    steps:
      - name: Set up Go oldstable
        uses: actions/setup-go@v7
        with:
          go-version: oldstable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test
        run: go test -v -cover ./...
